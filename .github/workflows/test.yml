name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
      - name: Install dependencies (root)
        run: npm ci
      - name: Install backend deps
        run: cd backend && npm ci
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: |
          npx playwright test --config=tests/playwright.config.ts --reporter=html,list
        continue-on-error: true
      - name: Debug – show current directory and files
        if: always()
        run: |
          echo "Current directory: $(pwd)"
          echo "Files in root:"
          ls -la
          echo "Looking for playwright-report:"
          if [ -d "playwright-report" ]; then
            echo "Folder exists, contents:"
            ls -la playwright-report/
          else
            echo "playwright-report folder NOT found"
          fi
      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn